# Change these first
owner: IfThenDev # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

# Assign down-issues to Miche so they notify under any watch setting
assignees:
  - IfThenDev

sites:
  - name: ARBookFind
    # The US site was rebuilt ~2026-11-14 (ASP.NET Core "AR BookFinder"); advanced.aspx is gone.
    # The app now answers this "Who are you?" page once, then searches /Search?q=<isbn>.
    # Assert the page's own form rendered (it returns 200 on soft failures too).
    url: https://www.arbookfind.com/UserType
    __dangerous__body_down_if_text_missing: "handler=Select"
  - name: Lexile
    url: https://atlas-fab.lexile.com/free/books/9780590353427
    headers:
      # API does versioned content negotiation; without this it returns 406
      - "Accept: application/json; version=1.0"
  - name: IfThenDev
    url: http://ifthendev.com

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  #cname: demo.upptime.js.org
  baseUrl: /upptime
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Upptime
  introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: This is a status page for sites related to If Then Dev, LLC apps
  navbar:
    - title: Status
      href: /
    - title: If Then Dev, LLC
      href: https://ifthendev.com

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
