# Change these first
owner: IfThenDev # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

# Assign down-issues to Miche so they notify under any watch setting
assignees:
  - IfThenDev

sites:
  - name: ARBookFind
    slug: ar-book-find            # explicit: renaming `name` can never move the slug the app matches
    # The app's own first request: an anonymous search, which the site 302s to its "Who are you?"
    # gate. Redirects are followed (maxRedirects default 3); only a final 200 counts as up, because
    # the app treats any other final status as a failed lookup.
    url: https://www.arbookfind.com/Search?q=9780064400558&lang=en&useLexile=false
    expectedStatusCodes:
      - 200
    # Up when the gate's Parent form (the one the app submits) rendered, or (should the site ever drop the gate) a results list.
    __dangerous__body_down_if_regex_missing: 'value="Parent"|id="searchResultsList"'
  - name: ARBookFind UK
    slug: ar-book-find-uk         # the UK host the app uses for UK schools (D-58-12)
    # The same anonymous search on the .co.uk host; only a final 200 counts as up, as for the US site.
    url: https://www.arbookfind.co.uk/Search?q=9780141316048&lang=en&useLexile=false
    expectedStatusCodes:
      - 200
    # Up when the gate's Parent form (the one the app submits) rendered, or (should the site ever drop the gate) a results list.
    __dangerous__body_down_if_regex_missing: 'value="Parent"|id="searchResultsList"'
  - name: Lexile
    slug: lexile
    # The app's Lexile Hub request for one ISBN that has a record; only 200 counts as up (a 404 here
    # would mean the route or record moved, not a "no level" answer).
    url: https://atlas-fab.lexile.com/free/books/9780590353427
    expectedStatusCodes:
      - 200
    headers:
      # API does versioned content negotiation; without this it returns 406
      - "Accept: application/json; version=1.0"
    # Up only when the reply is a real record.
    __dangerous__body_down_if_text_missing: '"success":true'
  - name: IfThenDev
    url: http://ifthendev.com

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  #cname: demo.upptime.js.org
  baseUrl: /upptime
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Upptime
  introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: This is a status page for sites related to If Then Dev, LLC apps
  navbar:
    - title: Status
      href: /
    - title: If Then Dev, LLC
      href: https://ifthendev.com

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
